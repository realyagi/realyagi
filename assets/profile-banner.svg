<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yagi — Developer profile banner</title>
  <desc id="desc">A dark navy developer portfolio banner with electric blue gradients, subtle grid lines, and the words Building ideas into products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D18"/><stop offset=".58" stop-color="#101B31"/><stop offset="1" stop-color="#07111F"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C2FF"/><stop offset="1" stop-color="#5865F2"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8AB4D8" stroke-opacity=".09" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>
  <circle cx="940" cy="90" r="150" fill="#087BCE" opacity=".20" filter="url(#blur)"/>
  <circle cx="1080" cy="290" r="120" fill="#5865F2" opacity=".20" filter="url(#blur)"/>
  <path d="M820 0L1200 0 1200 360 1080 360Z" fill="none" stroke="#6CCBFF" stroke-opacity=".16"/>
  <g transform="translate(82 78)">
    <rect x="0" y="0" width="5" height="190" rx="2.5" fill="url(#glow)"/>
    <text x="34" y="52" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">STUDENT DEVELOPER  /  INDIE BUILDER</text>
    <text x="30" y="125" fill="#F4F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2">Hey, I'm Yagi.</text>
    <text x="34" y="169" fill="#A9BBD2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Building ideas into useful products.</text>
  </g>
  <g transform="translate(890 102)">
    <rect x="0" y="0" width="220" height="150" rx="18" fill="#0B1628" stroke="#4ABEFF" stroke-opacity=".36"/>
    <circle cx="28" cy="28" r="5" fill="#48D597"/><circle cx="48" cy="28" r="5" fill="#F6C65B"/><circle cx="68" cy="28" r="5" fill="#F17C83"/>
    <path d="M34 69l-14 13 14 13M76 69l14 13-14 13M62 62L47 104" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M112 68h72M112 86h54M112 104h63" stroke="#91A9C6" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
    <text x="24" y="133" fill="#8FA8C6" font-family="ui-monospace,Consolas,monospace" font-size="12">CREATE · BUILD · IMPROVE</text>
  </g>
  <text x="86" y="320" fill="#66809F" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="2">AI  •  FULL-STACK  •  DEVELOPER TOOLS</text>
</svg>